name: Refresh data & deploy

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh-deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pushes the refreshed data back to main. If main is protected by a ruleset
          # that requires pull requests, set DATA_PUSH_TOKEN to a token (contents:
          # write) from an account on the ruleset's bypass list. Without it the
          # default token is used, which only works while main is unprotected.
          token: ${{ secrets.DATA_PUSH_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch fresh data
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: node scripts/fetch-data.mjs

      - name: Commit refreshed data (scheduled runs only)
        id: commit
        if: github.event_name != 'push'
        # A refused push (protected main) must not stop the deploy below: the site
        # is built from this working tree, which already has the fresh data.
        continue-on-error: true
        run: |
          git add site/data.json
          [ -f site/history.json ] && git add site/history.json
          if ! git diff --cached --quiet; then
            git config user.name "team-hub-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "data: scheduled refresh"
            git push
          fi

      - name: Warn that refreshed data was not saved
        if: steps.commit.outcome == 'failure'
        run: echo "::warning title=Refreshed data not saved::The push to main was refused, so data.json and history.json were deployed but not committed and the daily history did not grow. If main is protected, set the DATA_PUSH_TOKEN secret (see README, Quick start)."

      - name: Deploy to Cloudflare Pages
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # No directory or --project-name here: both come from wrangler.toml,
          # and passing the directory as well is an error once
          # pages_build_output_dir is set.
          command: pages deploy

      - name: Deploy skipped (Cloudflare secrets not set)
        if: env.CF_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — data refreshed, deploy skipped. See README."
